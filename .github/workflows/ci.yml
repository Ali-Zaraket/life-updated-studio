name: CI

# Deterministic checks only: no secrets, no network calls to Meta or TTS
# providers, no publishing. Live smoke tests (tests/live/) never run here.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The owner develops on Windows; the cloud sessions run on Linux.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install ffmpeg (media tests skip without it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  studio-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build studio (placeholder env; nothing connects)
        run: pnpm --filter @life/studio build
        env:
          DATABASE_URL: postgres://ci@127.0.0.1:1/ci
          STUDIO_SESSION_SECRET: ci-placeholder-session-secret-not-used-0123456789
          LIFE_OWNER_ID: owner

  postgres-races:
    # Real server, separate connections: lease and publish-job races.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: life
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U life" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/db/test/pg-race.test.ts
        env:
          PG_TEST_URL: postgres://life:ci-only-password@127.0.0.1:5432/postgres

  docker:
    # The owner runs everything through Docker Compose: build the real image (ffmpeg and
    # Remotion's browser included), start the stack and check it answers. Throwaway values only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: One-time setup through the tools service
        run: |
          cp .env.example .env.local
          docker compose run --rm -T tools pnpm --filter @life/studio approval-key
          HASH_LINE=$(printf 'ci-throwaway-passphrase\n' | docker compose run --rm -T tools pnpm -s --filter @life/studio hash-passphrase | tail -1)
          sed -i '/^STUDIO_PASSPHRASE_HASH=/d; /^STUDIO_SESSION_SECRET=/d' .env.local
          echo "$HASH_LINE" >> .env.local
          echo "STUDIO_SESSION_SECRET=$(openssl rand -base64 32)" >> .env.local
      - name: Start database, migrations, studio and worker
        run: docker compose up -d --wait studio worker
      - name: Studio answers; worker holds no private key
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:3100/login
          test -z "$(docker compose exec -T worker find /app/secrets -name '*.pem')"
      - name: Tools work (ffmpeg, mock vertical slice, pilot load)
        run: |
          docker compose run --rm -T tools ffmpeg -hide_banner -version
          docker compose run --rm -T tools pnpm slice
          docker compose run --rm -T tools pnpm pilot:load content/pilots/LU-TECH-002
      - name: Real Remotion render inside the image
        run: docker compose run --rm -T -e RENDER_TESTS=1 tools pnpm vitest run packages/render/test/render.test.ts
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
